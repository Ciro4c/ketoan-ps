<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kế toán PS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
/* Bố cục: thanh điều hướng trái + vùng làm việc; số liệu căn phải, chữ số đều (tabular) */
:root{
  --bg:#f3f5f4; --surface:#fff; --surface2:#f8faf9; --line:#dde3e0; --line2:#eaeeec;
  --ink:#18201d; --ink2:#52615b; --ink3:#83908a;
  --accent:#0d6e5d; --accent-ink:#fff; --accent-soft:#dff1ec; --accent-line:#a9d5ca;
  --ok:#1b7f45; --ok-soft:#e1f3e8; --warn:#9a6200; --warn-soft:#fdf0d4; --bad:#b3261e; --bad-soft:#fbe4e1; --info:#245fa8; --info-soft:#e2edfa;
  --side:#14201c; --side-ink:#c9d6d0; --side-act:#1f3a32; --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 14px rgba(20,32,28,.06);
  --font:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#172019; --surface2:#1b261f; --line:#2b3a32; --line2:#233028;
  --ink:#e6eeea; --ink2:#a5b5ad; --ink3:#78897f;
  --accent:#3fb59b; --accent-ink:#06201a; --accent-soft:#163a31; --accent-line:#27594b;
  --ok:#5fd08a; --ok-soft:#173826; --warn:#f0b955; --warn-soft:#3a2e12; --bad:#ff8b80; --bad-soft:#3d1c19; --info:#7fb3f0; --info-soft:#162a42;
  --side:#0a100e; --side-ink:#a9bab2; --side-act:#18302a; --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#172019; --surface2:#1b261f; --line:#2b3a32; --line2:#233028;
  --ink:#e6eeea; --ink2:#a5b5ad; --ink3:#78897f;
  --accent:#3fb59b; --accent-ink:#06201a; --accent-soft:#163a31; --accent-line:#27594b;
  --ok:#5fd08a; --ok-soft:#173826; --warn:#f0b955; --warn-soft:#3a2e12; --bad:#ff8b80; --bad-soft:#3d1c19; --info:#7fb3f0; --info-soft:#162a42;
  --side:#0a100e; --side-ink:#a9bab2; --side-act:#18302a; --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:20px}h2{font-size:15px}h3{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
a{color:var(--accent)}
.num,td.r,th.r,input.num{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:12px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden}.app>.side,.app>.main{min-height:0;height:100vh}
.side{background:var(--side);color:var(--side-ink);overflow:auto;display:flex;flex-direction:column;padding-block:14px}
.brand{padding:4px 18px 14px;color:#fff;font-weight:600;font-size:15px;letter-spacing:.01em;display:flex;gap:10px;align-items:center}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:600 12px var(--mono);font-style:normal}
.brand small{display:block;font-weight:400;color:var(--side-ink);opacity:.7;font-size:11px}
.nav-g{padding:12px 18px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7f918a}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 18px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.04)}
.nav a.on{background:var(--side-act);border-left-color:var(--accent);color:#fff}
.nav .bd{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nav .bd.w{background:var(--warn);color:#1a1200}
.side-foot{margin-top:auto;padding:14px 18px 0;font-size:11.5px;color:#7f918a}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.page{padding:18px 20px 40px;overflow:auto;flex:1;min-height:0}
.page>*+*{margin-top:16px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph .sub{color:var(--ink2);margin-top:2px}
.ph .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.card>h2+*{margin-top:10px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kpi .l{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--bad)}.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;font-family:var(--mono);font-size:12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
label.f>input,label.f>select{color:var(--ink);font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp>.g{flex:1}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.form .w2{grid-column:span 2}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:500;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.ok,.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn,.pill.soon{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad,.pill.late,.pill.unpaid{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info,.pill.open{background:var(--info-soft);color:var(--info);border-color:transparent}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink2);margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tw{overflow:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:4px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:hover td{background:var(--surface2)}
table.t .c{text-align:center}table.t .r{text-align:right}
table.t tr.tot td{font-weight:600;background:var(--surface2);border-top:1px solid var(--line)}
table.t tr.grp td{font-weight:700;background:var(--accent-soft);color:var(--ink)}
table.t tr.sub td{font-weight:600}
table.t tr.ind td:first-child{padding-left:26px;color:var(--ink2)}
table.t td.neg{color:var(--bad)}
.rep-h{text-align:center;padding:10px 0 4px}.rep-h b{font-size:15px;display:block}
.rep-co{font-size:12px;color:var(--ink2);padding:0 0 6px}
/* lưới PS */
.ps{font-size:12.5px;width:max-content;min-width:100%}
.ps td{padding:0;border-bottom:1px solid var(--line2)}
.ps td input,.ps td select{width:100%;border:0;border-radius:0;background:transparent;padding:5px 6px;height:28px}
.ps td input:focus,.ps td select:focus{background:var(--accent-soft);outline:1px solid var(--accent);outline-offset:-1px}
.ps td.st{width:26px;text-align:center;padding:0 2px}
.ps tr.vs td{border-top:2px solid var(--line)}
.ps tr.same td input.ct{color:var(--ink3)}
.ps tr.auto td{background:var(--surface2)}
.ps tr.auto td input,.ps tr.lock td input{color:var(--ink3);pointer-events:none}
.ps tr.lock td{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line2) 6px 7px)}
.ps tr.hl td{background:var(--warn-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.err{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}
.ps th.r,.ps td.r input{text-align:right}
.ps .x{opacity:.0;cursor:pointer;border:0;background:none;color:var(--bad);padding:0 4px}
.ps tr:hover .x{opacity:1}
.sev{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2);align-items:flex-start}
.sev:hover{background:var(--surface2)}
.sev .m{flex:1}
.notice{padding:9px 12px;border-radius:6px;background:var(--info-soft);color:var(--ink);border:1px solid var(--accent-line);font-size:12.5px}
.notice.warn{background:var(--warn-soft);border-color:transparent}.notice.bad{background:var(--bad-soft);border-color:transparent}.notice.ok{background:var(--ok-soft);border-color:transparent}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:100%;width:760px;border:1px solid var(--line)}
.modal.wide{width:1000px}
.modal>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal>header h2{flex:1}.modal>.bd{padding:14px 16px}.modal>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:90;box-shadow:var(--shadow)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tpls button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer}
.tpls button:hover{border-color:var(--accent);background:var(--accent-soft)}
.tpls .g{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.spark{width:100%;height:120px;display:block}
.cal-i{display:grid;grid-template-columns:96px 1fr auto auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);align-items:center}
.cal-i .d{font-variant-numeric:tabular-nums;font-weight:600}
.menu-btn{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding:0}.brand{padding:8px 12px}.nav{display:flex}.nav-g,.side-foot{display:none}.nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:12px 10px}.nav a.on{border-bottom-color:var(--accent)}
  .nav-wrap{display:flex;overflow-x:auto}
  .brand small{display:none}.brand div{white-space:nowrap}
  .page{padding:14px 16px 30px}.top{padding:8px 16px}
}
@media print{.side,.top,.noprint{display:none!important}.app{display:block;height:auto}.page{overflow:visible;padding:0}body{background:#fff;color:#000}.card{border:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Ctrl+K */
.cmbox{width:min(620px,calc(100vw - 32px));margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.cmbox input{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;background:transparent;color:var(--ink);outline:none}
.cml{max-height:50vh;overflow:auto}
.cmi{display:grid;grid-template-columns:84px 1fr auto;gap:10px;padding:9px 16px;cursor:pointer;align-items:baseline}
.cmi.on,.cmi:hover{background:var(--accent-soft)}
.cmk{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.cms{font-size:12px;color:var(--ink3)}
.cmh{padding:7px 16px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
#cmdk{align-items:flex-start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.nav-g{cursor:pointer;user-select:none}.nav-g::after{content:"▾";float:right;opacity:.6}.nav-g.closed::after{content:"▸"}

.brand{position:relative}.brand .dlapp{order:3;margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;padding:0}.brand .dlapp:hover{background:rgba(255,255,255,.12)}

<div id="app" class="app"></div>
<script>
/* ===== KẾ TOÁN PS — core: tiện ích, trạng thái, lưu trữ ===== */
(function (G) {
'use strict';
const KT = G.KT = G.KT || {};
/* chép nguyên mã trang để nút “Tải bản ngoại tuyến” tạo lại đúng file HTML này (chụp trước khi dựng giao diện) */
try { KT.pageSource = '<!doctype html>\n' + G.document.documentElement.outerHTML; } catch (e) { KT.pageSource = ''; }

/* ---------- số ---------- */
KT.rnd = x => { x = +x || 0; return x < 0 ? -Math.round(-x) : Math.round(x); };
KT.num = v => {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null || v === '') return 0;
  let s = String(v).trim().replace(/\s/g, '').replace(/[đ₫]/gi, '');
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
/** số tiền: 1.234.567 ; âm: -1.234 ; 0 → '' (dash=true → '-') */
KT.f = (n, dash) => { n = KT.rnd(n); if (!n) return dash ? '-' : ''; return (n < 0 ? '-' : '') + grp(String(Math.abs(n))); };
/** số tiền BCTC: âm trong ngoặc */
KT.fp = (n, dash) => { n = KT.rnd(n); if (!n) return dash === false ? '' : '-'; return n < 0 ? '(' + grp(String(-n)) + ')' : grp(String(n)); };
/** số lượng: tối đa 3 lẻ */
KT.fq = n => { n = +n || 0; if (!n) return ''; const r = Math.round(n * 1000) / 1000; const [a, b] = String(Math.abs(r)).split('.'); return (r < 0 ? '-' : '') + grp(a) + (b ? ',' + b : ''); };
KT.pct = (n, d = 1) => (n * 100).toFixed(d).replace('.', ',') + '%';
KT.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- ngày (ISO yyyy-mm-dd) ---------- */
const D = KT.d = {};
const p2 = n => String(n).padStart(2, '0');
D.iso = (y, m, d) => y + '-' + p2(m) + '-' + p2(d);
D.parse = v => {
  if (v == null || v === '') return '';
  if (v instanceof Date) return isNaN(v) ? '' : D.iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') { if (v > 20000 && v < 90000) { const dt = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return D.iso(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); } return ''; }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return D.valid(D.iso(+m[1], +m[2], +m[3]));
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += 2000; return D.valid(D.iso(y, +m[2], +m[1])); }
  if (/^\d{5}$/.test(s)) return D.parse(+s);
  return '';
};
D.valid = s => { const [y, m, d] = s.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d ? s : ''; };
D.fmt = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
D.ym = s => s.slice(0, 7);
D.year = s => +s.slice(0, 4);
D.eom = ym => { const [y, m] = ym.split('-').map(Number); return D.iso(y, m, new Date(Date.UTC(y, m, 0)).getUTCDate()); };
D.bom = ym => ym + '-01';
D.addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d + n)); return D.iso(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); };
D.diff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
D.addMonths = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + '-' + p2(m); };
D.monthsBetween = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
D.quarter = ym => Math.ceil(+ym.slice(5, 7) / 3);
D.qRange = (y, q) => [D.iso(y, (q - 1) * 3 + 1, 1), D.eom(y + '-' + p2(q * 3))];
D.yRange = y => [D.iso(y, 1, 1), D.iso(y, 12, 31)];
D.today = () => D.parse(new Date());
/** ngày làm việc kế tiếp nếu rơi T7/CN */
D.nextWorkday = s => { let x = s; for (let i = 0; i < 4; i++) { const dt = new Date(x + 'T00:00:00Z'); const w = dt.getUTCDay(); if (w === 0 || w === 6) x = D.addDays(x, 1); else break; } return x; };
D.workdays = (ym, sat) => { const [y, m] = ym.split('-').map(Number); const n = new Date(Date.UTC(y, m, 0)).getUTCDate(); let c = 0; for (let d = 1; d <= n; d++) { const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); if (w !== 0 && (sat || w !== 6)) c++; } return c; };

/* ---------- tham số pháp lý (có hiệu lực theo ngày) ---------- */
KT.defaultLegal = () => ({
  luongCoSo: [{ from: '2024-07-01', v: 2340000 }, { from: '2026-07-01', v: 2530000 }],
  luongTT: {   // lương tối thiểu tháng theo vùng
    1: [{ from: '2024-07-01', v: 4960000 }, { from: '2026-01-01', v: 5310000 }],
    2: [{ from: '2024-07-01', v: 4410000 }, { from: '2026-01-01', v: 4730000 }],
    3: [{ from: '2024-07-01', v: 3860000 }, { from: '2026-01-01', v: 4140000 }],
    4: [{ from: '2024-07-01', v: 3450000 }, { from: '2026-01-01', v: 3700000 }]

const KT = G.KT, D = KT.d;

const grpOf = a => { const r = String(a || '').slice(0, 3); return (r === '152' || r === '153' || r === '156' || r === '158') ? 'A' : (r === '155' || r === '157') ? 'B' : ''; };
KT.invGroup = grpOf;
KT.extraChecks = [];

function pFlag(a) { return !!a && KT.acc.flag(a, 'p'); }

/** chuẩn hóa một dòng PS */
function norm(j, oi) {
  const S = KT.S;
  const no = String(j.no == null ? '' : j.no).trim(), co = String(j.co == null ? '' : j.co).trim();
  const l = {
    oi, id: j.id, ct: String(j.ct || '').trim(), vk: KT.vkey(j.ct), date: D.parse(j.ng) || '', no, co,
    st: KT.num(j.st), dg: j.dg || '', hd: j.hd == null ? '' : String(j.hd).trim(), kh: j.kh || '', nhd: D.parse(j.nhd) || '',
    vt: j.vt == null ? '' : String(j.vt).trim(), sl: KT.num(j.sl), gia: KT.num(j.gia), dh: j.dh ? String(j.dh).trim() : '',
    thue: j.thue == null ? '' : String(j.thue), gt: KT.num(j.gt), lc: j.lc || '', tn: j.tn || '', kt: j.kt || '',
    nth: j.nth || '', dvth: j.dvth || '', tag: j.tag || '', ts: j.ts || '', src: j, dn: '', dc: '', pt: '', amt: 0, auto: false, derived: false
  };
  const dt = j.dt ? String(j.dt).trim() : '', dt2 = j.dt2 ? String(j.dt2).trim() : '';
  const pn = pFlag(no), pc = pFlag(co);
  if (j.dn || j.dc) { l.dn = j.dn || ''; l.dc = j.dc || ''; }
  else if (pn && pc) { l.dn = dt; l.dc = dt2 || dt; }
  else if (pn) l.dn = dt; else if (pc) l.dc = dt;
  l.pt = dt || l.dn || l.dc || '';
  l.close = no.startsWith('911') || co.startsWith('911');
  l.validAcc = KT.acc.has(no) && KT.acc.has(co);
  return l;
}

KT.compute = function () {
  const S = KT.S;
  if (KT._cache && KT._cache.ver === KT.version) return KT._cache;
  const t0 = Date.now();
  const issues = [];
  const add = (sev, code, msg, l, extra) => issues.push(Object.assign({ sev, code, msg, ct: l ? l.ct : '', id: l ? l.id : '', date: l ? l.date : '' }, extra || {}));

  /* 1. chuẩn hóa + sắp xếp */
  const all = S.journal.map(norm);
  const dated = [], undated = [];
  all.forEach(l => (l.date && l.no && l.co && l.no !== l.co ? dated : undated).push(l));
  dated.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.oi - b.oi);
  dated.forEach((l, i) => l.n = i + 1);

  /* 2. định giá kho */
  const pool = new Map();            // vt → {q,v}
  const lastCost = new Map();
  const itemMap = new Map(S.items.map(x => [x.code, x]));
  for (const o of S.opening) if (o.vt) { const p = pool.get(o.vt) || { q: 0, v: 0 }; p.q += KT.num(o.sl); p.v += KT.num(o.no) - KT.num(o.co); pool.set(o.vt, p); if (p.q > 0) lastCost.set(o.vt, p.v / p.q); }
  const stockEv = new Map();         // vt → [{date, dq, dv, l}] cho thẻ kho
  const months = [];
  { let cur = null; for (const l of dated) { const ym = D.ym(l.date); if (!cur || cur.ym !== ym) { cur = { ym, ls: [] }; months.push(cur); } cur.ls.push(l); } }
  const bal154 = new Map();
  /* phương pháp tính giá xuất kho: bqgq (bình quân cả tháng) | bqdd (bình quân sau mỗi lần nhập) | fifo | dd (đích danh: nhập đơn giá ở dòng xuất) */
  const method = (S.company && S.company.phuongPhapGia) || 'bqgq'; KT.costMethod = method;
  const layers = new Map();
  if (method === 'fifo') for (const o of S.opening) if (o.vt && KT.num(o.sl) > 0) { const a = layers.get(o.vt) || []; a.push({ q: KT.num(o.sl), v: KT.num(o.no) - KT.num(o.co) }); layers.set(o.vt, a); }
  const alt = (m, isIn, isOut) => {
    const run = new Map(); const R = vt => { let r = run.get(vt); if (!r) { const p = getP(vt); r = { q: p.q, v: p.v }; run.set(vt, r); } return r; };
    for (const l of m.ls) {
      const io = isOut(l), ii = isIn(l);
      if (io && !l.manual) {
        const vt = l.vt; let amt = 0;
        if (method === 'bqdd') { const r = R(vt); const u = r.q > 1e-9 ? r.v / r.q : (lastCost.get(vt) || 0); amt = KT.rnd(l.sl * u); }
        else if (method === 'fifo') {
          const q = layers.get(vt) || []; let need = l.sl, v = 0;
          while (need > 1e-9 && q.length) { const y = q[0]; const t = Math.min(need, y.q); const part = y.q > 0 ? y.v * t / y.q : 0; y.q -= t; y.v -= part; v += part; need -= t; if (y.q <= 1e-9) q.shift(); }
          if (need > 1e-9) v += need * (lastCost.get(vt) || 0); amt = KT.rnd(v);
        } else if (method === 'dd') amt = l.gia ? KT.rnd(l.sl * l.gia) : 0;
        l.amt = amt; l.auto = method !== 'dd';
      }
      if (grpOf(l.no) === 'B' && !l.amt && l.co.startsWith('154')) { const b = bal154.get(l.dh || '') || 0; if (b > 0) { l.amt = KT.rnd(b); l.derived = true; } }
      if (l.no.startsWith('154')) bal154.set(l.dh || '', (bal154.get(l.dh || '') || 0) + l.amt);
      if (l.co.startsWith('154')) bal154.set(l.dh || '', (bal154.get(l.dh || '') || 0) - l.amt);
      if (io && !ii) { const r = R(l.vt); r.q -= l.sl; r.v -= l.amt; }
      if (ii && !io) { const r = R(l.vt); r.q += l.sl; r.v += l.amt; if (method === 'fifo' && l.amt) { const q = layers.get(l.vt) || []; q.push({ q: l.sl, v: l.amt }); layers.set(l.vt, q); } }
    }
  };
  const getP = vt => { let p = pool.get(vt); if (!p) { p = { q: 0, v: 0 }; pool.set(vt, p); } return p; };
  for (const m of months) {
    const ins = new Map();           // vt → {q,v} nhập trong tháng
    const addIn = (vt, q, v) => { const x = ins.get(vt) || { q: 0, v: 0 }; x.q += q; x.v += v; ins.set(vt, x); };
    const isIn = l => grpOf(l.no) && l.vt && l.sl > 0;
    const isOut = l => grpOf(l.co) && l.vt && l.sl > 0;
    // số tiền nhập tường minh
    for (const l of m.ls) {
      const manual = l.st || (l.sl && l.gia && !isOut(l) ? KT.rnd(l.sl * l.gia) : 0);
      l.amt = l.st ? l.st : (isOut(l) ? 0 : manual);
      l.manual = !!l.st;
    }
    if (method !== 'bqgq') alt(m, isIn, isOut); else {
    const unit = (vt, extra) => {
      const p = getP(vt), e = ins.get(vt) || { q: 0, v: 0 };
      const q = p.q + e.q, v = p.v + e.v;
      if (q > 1e-9) return v / q;
      return lastCost.get(vt) || 0;
    };
    for (const l of m.ls) if (isIn(l) && !isOut(l) && l.amt && grpOf(l.no) === 'A') addIn(l.vt, l.sl, l.amt);
    for (const l of m.ls) if (isIn(l) && !isOut(l) && l.amt && grpOf(l.no) === 'B') addIn(l.vt, l.sl, l.amt);
    // pass 1 theo thời gian
    for (const l of m.ls) {
      // xuất nhóm A
      if (isOut(l) && grpOf(l.co) === 'A' && !l.manual) { l.amt = KT.rnd(l.sl * unit(l.vt)); l.auto = true; }
      // nhập thành phẩm giá trị trống ← số dư 154 theo đơn hàng
      if (grpOf(l.no) === 'B' && !l.amt && l.co.startsWith('154')) {
        const b = bal154.get(l.dh || '') || 0; if (b > 0) { l.amt = KT.rnd(b); l.derived = true; if (l.vt && l.sl > 0) addIn(l.vt, l.sl, l.amt); }
      }
      // theo dõi 154
      if (l.no.startsWith('154')) bal154.set(l.dh || '', (bal154.get(l.dh || '') || 0) + l.amt);
      if (l.co.startsWith('154')) bal154.set(l.dh || '', (bal154.get(l.dh || '') || 0) - l.amt);
    }
    // pass 2: xuất nhóm B
    for (const l of m.ls) if (isOut(l) && grpOf(l.co) === 'B' && !l.manual) { l.amt = KT.rnd(l.sl * unit(l.vt)); l.auto = true; }
    }
    // cập nhật kho cuối tháng + làm tròn phần dư
    const lastAuto = new Map();
    for (const l of m.ls) {
      if (isOut(l) && !isIn(l)) { const p = getP(l.vt); p.q -= l.sl; p.v -= l.amt; if (l.auto) lastAuto.set(l.vt, l); stockEv.has(l.vt) || stockEv.set(l.vt, []); stockEv.get(l.vt).push({ l, dq: -l.sl, dv: -l.amt }); }
      if (isIn(l) && !isOut(l)) { const p = getP(l.vt); p.q += l.sl; p.v += l.amt; stockEv.has(l.vt) || stockEv.set(l.vt, []); stockEv.get(l.vt).push({ l, dq: l.sl, dv: l.amt }); }
    }
    for (const [vt, l] of lastAuto) { const p = getP(vt); if (Math.abs(p.q) < 1e-9 && p.v !== 0 && Math.abs(p.v) <= 50) { l.amt += p.v; p.v = 0; const ev = stockEv.get(vt); for (let k = ev.length - 1; k >= 0; k--) if (ev[k].l === l) { ev[k].dv = -l.amt; break; } } }
    for (const [vt, p] of pool) if (p.q > 1e-9) lastCost.set(vt, p.v / p.q);
  }
  // dòng ngoài tháng-định-giá (không có vt) giữ amt = st
  for (const l of dated) if (!l.vt || !l.sl) { if (!l.amt) l.amt = l.st; }

  /* 3. chỉ mục theo tài khoản (mọi tiền tố ≥ 3 ký tự) */
  const byAcc = new Map();
  const push = (a, e) => { for (let n = 3; n <= a.length; n++) { const k = a.slice(0, n); let arr = byAcc.get(k); if (!arr) byAcc.set(k, arr = []); arr.push(e); } };
  for (const l of dated) {
    push(l.no, { l, s: 'N', p: l.dn, a: l.no });
    push(l.co, { l, s: 'C', p: l.dc, a: l.co });
  }
  const openAcc = S.opening;

  const L = {
    ver: KT.version, lines: dated, all, undated, byAcc, pool, stockEv, months, issues, items: itemMap,
    first: dated.length ? dated[0].date : '', last: dated.length ? dated[dated.length - 1].date : ''
  };
  const lower = (arr, d) => { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].l.date < d) lo = mid + 1; else hi = mid; } return lo; };
  const upper = (arr, d) => { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].l.date <= d) lo = mid + 1; else hi = mid; } return lo; };

  /** Tổng phát sinh Nợ/Có của TK (tiền tố) trong [from,to].  f: {dt, vt, dh, noClose, only:'N'|'C', counter} */
  L.mov = (tk, from, to, f) => {
    f = f || {}; const arr = byAcc.get(String(tk)); let n = 0, c = 0;
    if (!arr) return { n, c };
    const i0 = from ? lower(arr, from) : 0, i1 = to ? upper(arr, to) : arr.length;
    for (let i = i0; i < i1; i++) {
      const e = arr[i], l = e.l;
      if (f.noClose && l.close) continue;
      if (f.dt != null && e.p !== f.dt) continue;
      if (f.vt != null && l.vt !== f.vt) continue;
      if (f.dh != null && l.dh !== f.dh) continue;
      if (f.counter && !(e.s === 'N' ? l.co : l.no).startsWith(f.counter)) continue;
      if (f.notCounter && (e.s === 'N' ? l.co : l.no).startsWith(f.notCounter)) continue;
      if (f.tag && !l.tag.startsWith(f.tag)) continue;
      if (f.only && f.only !== e.s) continue;
      if (e.s === 'N') n += l.amt; else c += l.amt;
    }
    return { n, c };
  };
  /** Số dư đầu kỳ nhập tay của TK (tiền tố) */
  L.openTbl = (tk, f) => {
    f = f || {}; let n = 0, c = 0, q = 0;
    for (const o of openAcc) {
      if (!String(o.tk).startsWith(String(tk))) continue;
      if (f.dt != null && (o.dt || '') !== f.dt) continue;
      if (f.vt != null && (o.vt || '') !== f.vt) continue;
      if (f.dh != null && (o.dh || '') !== f.dh) continue;
      n += KT.num(o.no); c += KT.num(o.co); q += KT.num(o.sl);
    }
    return { n, c, q };
  };
  /** Số dư thuần (Nợ − Có) trước ngày `date` (không gồm ngày đó) */
  L.balBefore = (tk, date, f) => {
    const o = L.openTbl(tk, f); const m = L.mov(tk, '', date ? D.addDays(date, -1) : '', f);
    return o.n - o.c + m.n - m.c;
  };
  /** Số dư thuần (Nợ − Có) cuối ngày `date` */
  L.bal = (tk, date, f) => { const o = L.openTbl(tk, f); const m = L.mov(tk, '', date, f); return o.n - o.c + m.n - m.c; };
  /** Số dư theo từng đối tượng cuối ngày: Map code → net (Nợ − Có) */
  L.partnerBal = (tk, date, f) => {
    const mp = new Map(); const arr = byAcc.get(String(tk)) || [];
    for (const o of openAcc) if (String(o.tk).startsWith(String(tk)) && (!f || f.noPartnerless !== false)) { const k = o.dt || ''; mp.set(k, (mp.get(k) || 0) + KT.num(o.no) - KT.num(o.co)); }
    const i1 = date ? upper(arr, date) : arr.length;
    for (let i = 0; i < i1; i++) { const e = arr[i]; const k = e.p || ''; mp.set(k, (mp.get(k) || 0) + (e.s === 'N' ? e.l.amt : -e.l.amt)); }
    return mp;
  };
  /** Lãi/lỗ thực hiện trong kỳ (từ các TK 5xx–8xx, loại trừ bút toán kết chuyển 911) */
  L.pnl = (from, to) => {
    const v = a => { const m = L.mov(a, from, to, { noClose: true }); return m.c - m.n; };   // dư Có dương
    const rev = v('511') + v('515') + v('711'), exp = -(v('521') + v('632') + v('635') + v('641') + v('642') + v('811') + v('821'));
    return rev - exp;
  };
  L.stockQty = (vt, date) => { let q = 0; const p = L.openTbl('15', { vt }); q += p.q; for (const ev of (stockEv.get(vt) || [])) if (ev.l.date <= date) q += ev.dq; return q; };

  /* 4. vouchers */
  const vmap = new Map();
  for (const l of all) {
    const k = l.vk + '|' + l.date; let v = vmap.get(k);
    if (!v) vmap.set(k, v = { key: l.vk, date: l.date, lines: [], total: 0, type: KT.vtype(l.ct) });
    v.lines.push(l); v.total += l.amt || l.st;
  }
  L.vouchers = [...vmap.values()];
  L.voucherOf = l => vmap.get(l.vk + '|' + l.date);

  /* 5. kiểm soát */
  const pm = new Map(S.partners.concat(S.employees.map(e => ({ code: e.code, name: e.name, type: 'NV' }))).map(x => [x.code, x])), om = new Map(S.orders.map(x => [x.code, x]));
  L.pm = pm; L.om = om;
  const lockedUntil = S.lockedUntil || '';
  const noPartnerAcc = a => KT.acc.flag(a, 'p');
  const seenCt = new Map();
  for (const l of all) {
    if (!l.date) { add('err', 'E04', 'Ngày chứng từ trống hoặc sai định dạng', l); continue; }
    if (!l.no || !l.co) { add('err', 'E01', 'Thiếu TK Nợ hoặc TK Có', l); continue; }
    if (l.no === l.co) { add('err', 'E02', 'TK Nợ trùng TK Có (' + l.no + ')', l); continue; }
    if (!l.validAcc) add('err', 'E01', 'TK ' + (!KT.acc.has(l.no) ? l.no : l.co) + ' không có trong hệ thống tài khoản', l, { acc: !KT.acc.has(l.no) ? l.no : l.co, fld: !KT.acc.has(l.no) ? 'no' : 'co' });
    if (!l.amt && !(l.st)) add('err', 'E03', l.sl && grpOf(l.co) ? 'Không xác định được giá trị xuất kho (tồn kho bằng 0 hoặc chưa có giá nhập)' : l.sl && grpOf(l.no) && l.co.startsWith('154') ? 'Nhập thành phẩm nhưng chưa có chi phí dở dang (154) theo đơn hàng ' + (l.dh || '(trống)') : 'Thiếu số tiền', l);
    if (l.amt < 0) add('info', 'I01', 'Số tiền âm (bút toán ghi đỏ)', l);
    if (lockedUntil && S.lockedAt && !l.tag && l.date <= lockedUntil && l.src.mod && !l.src.lockOk && l.src.mod > S.lockedAt.slice(0, 10)) add('err', 'E05', 'Chứng từ nhập tay thuộc kỳ đã khóa sổ (' + D.fmt(lockedUntil) + ') bị thêm/sửa sau khi khóa (' + D.fmt(S.lockedAt.slice(0, 10)) + ')', l);
    // đối tượng
    for (const [side, a, p] of [['Nợ', l.no, l.dn], ['Có', l.co, l.dc]]) {
      if (noPartnerAcc(a) && !a.startsWith('3335')) {
        if (!p && !(a.startsWith('338') && !a.startsWith('3388')) ) { if (/^(131|331|141|334|341|411|136|138|3388|244|344|332)/.test(a)) add('warn', 'W09', 'TK ' + a + ' (' + side + ') cần mã đối tượng để lên sổ chi tiết', l, { acc: a, side }); }
        else if (p && !pm.has(p)) add('err', 'E10', 'Mã đối tượng "' + p + '" chưa có trong danh mục', l, { acc: a, side, p });
      }
    }
    if (l.vt && !itemMap.has(l.vt) && (grpOf(l.no) || grpOf(l.co))) add('err', 'E10', 'Mã hàng "' + l.vt + '" chưa có trong danh mục vật tư, hàng hóa', l, { vt: l.vt, acc: grpOf(l.no) ? l.no : l.co });
    if ((grpOf(l.no) || grpOf(l.co)) && !l.vt && !l.sl ) add('warn', 'W10', 'Bút toán kho (' + (grpOf(l.no) ? l.no : l.co) + ') thiếu mã hàng / số lượng', l);
    if (l.dh && !om.has(l.dh)) add('warn', 'W12', 'Mã đơn hàng "' + l.dh + '" chưa có trong danh mục', l, { dh: l.dh });
    if (l.vt && l.sl && l.vt && itemMap.has(l.vt)) { const it = itemMap.get(l.vt); const a = grpOf(l.no) ? l.no : l.co; if (it.tk && a && !a.startsWith(it.tk) && !(it.tk === '156' && a.startsWith('157')) && !(it.tk === '155' && a.startsWith('157')) && grpOf(a)) add('warn', 'W11', 'Mã hàng ' + l.vt + ' thuộc TK ' + it.tk + ' nhưng bút toán dùng TK ' + a, l); }
  }
  // trùng số chứng từ khác ngày
  const ctDates = new Map();
  for (const l of dated) { const s = ctDates.get(l.vk) || new Set(); s.add(l.date); ctDates.set(l.vk, s); }
  for (const [k, s] of ctDates) if (s.size > 1 && k) issues.push({ sev: 'warn', code: 'W15', msg: 'Số chứng từ "' + k + '" xuất hiện ở ' + s.size + ' ngày khác nhau (' + [...s].slice(0, 3).map(D.fmt).join(', ') + '…) – nên đánh số duy nhất', ct: k, id: '', date: [...s][0] });

  // tiền mặt âm theo ngày / TGNH âm
  const cashCheck = (tk, sev, label) => {
    const arr = byAcc.get(tk) || []; if (!arr.length) return;
    let bal = L.openTbl(tk).n - L.openTbl(tk).c, i = 0, firstBad = null, cnt = 0, minBal = 0;
    while (i < arr.length) {
      const d = arr[i].l.date; let inn = 0, out = 0, j = i;
      for (; j < arr.length && arr[j].l.date === d; j++) { if (arr[j].s === 'N') inn += arr[j].l.amt; else out += arr[j].l.amt; }
      bal += inn - out;
      if (bal < -0.5) { cnt++; if (!firstBad) firstBad = { d, bal }; if (bal < minBal) minBal = bal; }
      i = j;
    }
    if (firstBad) issues.push({ sev, code: sev === 'err' ? 'E06' : 'W07', msg: label + ' âm ' + KT.f(-firstBad.bal) + ' đ vào ngày ' + D.fmt(firstBad.d) + (cnt > 1 ? ' (và ' + (cnt - 1) + ' ngày khác)' : '') + ' – chưa có tiền mà đã chi: thiếu số dư đầu kỳ, thiếu phiếu thu hoặc sai ngày chứng từ' + (cnt > 1 ? '; thiếu nhiều nhất ' + KT.f(-minBal) + ' đ' : ''), ct: '', id: '', date: firstBad.d, tk, need: -minBal });
  };
  cashCheck('111', 'err', 'Quỹ tiền mặt'); cashCheck('112', 'warn', 'Tiền gửi ngân hàng');

  for (const p of ps) { k++; prog('Đang lập ' + p.label + ' (' + k + '/' + ps.length + ')…'); await new Promise(r => setTimeout(r, 0));
    const has = S().journal.some(j => { const d = D.parse(j.ng) || ''; return d >= p.from && d <= p.to; }); if (!has && p.kind !== 'nam') continue;
    const ym = p.ym || p.to.slice(0, 7); p.hasPay = KT.hr && KT.hr.month(ym).rows.length > 0 && ((S().payroll || {})[ym] || S().journal.some(j => String(j.co).startsWith('334') && String(D.parse(j.ng) || '').slice(0, 7) === ym));
    const s = ser.find(x => x.per.from === p.from && x.per.to === p.to);
    const cat = UI.printCat(p, { ky: s ? s.per.key : '__none', ym, tk: '', vt: '', dt: '' }).map(it => Object.assign(it, { ser: s }));
    const dir = root + p.dir + '/';
    for (const it of cat) { if (!o[it.g] || !want(it, p)) continue;
      if (it.g === 'ct' && o.tach) { const vs = UI.printVouchers(p, it.id.slice(1)); vs.forEach(v => { const nm = dir + GNAME.ct + '/' + safe(it.name.replace(/ \(.*$/, '')) + '/' + safe(D.fmt(v.date).replace(/\//g, '-') + ' ' + (v.ct || v.key)) + '.html'; files.push({ name: nm, data: UI.printDoc(it.name, UI.voucherHtml(v, it.id.slice(1))) }); toc.push(nm); }); continue; }
      if (it.g === 'ct' && !UI.printVouchers(p, it.id.slice(1)).length) continue;
      let h; try { h = it.fn(); } catch (e) { h = '<p style="color:#900">Không lập được: ' + E(e.message || e) + '</p>'; }
      const nn = safe(it.name.replace(/ \(\d+ chứng từ trong kỳ\)| \(kỳ đang chọn\)/, '')), nm = dir + GNAME[it.g] + '/' + (it.mau && it.mau !== 'Danh sách' && !nn.startsWith(safe(it.mau)) ? safe(it.mau) + ' ' : '') + nn + '.html'; files.push({ name: nm, data: UI.printDoc(it.name + ' – ' + p.label, h) }); toc.push(nm); }
    if (o.ps) { const rows = psRows(p.from, p.to, o.auto); if (rows.length) { const nm = dir + GNAME.ps + '/So PS ' + safe(p.label) + '.xls'; files.push({ name: nm, data: KT.psXls(rows, 'SỔ PS – ' + p.label) }); toc.push(nm); } } }
  files.push({ name: root + '00 Muc luc.html', data: '<!doctype html><meta charset="utf-8"><title>Mục lục</title><body style="font:14px Arial;padding:20px"><h2>' + E(S().company.name) + '</h2><p>Lập ngày ' + D.fmt(D.today()) + '. ' + toc.length + ' file. Mở file HTML bằng trình duyệt và bấm Ctrl+P để in hoặc lưu PDF.</p><ol>' + toc.map(n => '<li><a href="' + encodeURI(n.slice(root.length)) + '">' + E(n.slice(root.length)) + '</a></li>').join('') + '</ol></body>' });
  return { files, root }; };

UI.act.zipgo = async () => { const o = BG(); if (o.busy) return; if (!o.thang && !o.quy && !o.nam && !o.ky) { UI.toast('Chọn ít nhất một kỳ: tháng, quý, năm hoặc kỳ đang chọn'); return; } if (!['so', 'bc', 'th', 'ld', 'ct', 'dm', 'ps'].some(k => o[k])) { UI.toast('Chọn ít nhất một loại'); return; }
  o.busy = true; const el = () => document.getElementById('zipst'); const prog = t => { const x = el(); if (x) x.textContent = t; };
  try { const r = await buildFiles(o, prog); prog('Đang nén ' + r.files.length + ' file…'); await new Promise(z => setTimeout(z, 0)); const blob = KT.zip(r.files);
    UI.downloadBlob(r.root.slice(0, -1) + '.zip', blob); prog('Đã tạo ' + (r.files.length - 1) + ' file, ' + Math.round(blob.size / 1024) + ' KB.'); }
  catch (e) { console.error(e); prog('Lỗi: ' + (e.message || e)); } finally { o.busy = false; } };
UI.chg.zipo = el => { const o = BG(); o[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; };
UI.zipCard = () => { const o = BG(); const ck = (k, t) => '<label class="small" style="display:inline-flex;gap:4px;align-items:center;margin-right:10px"><input type="checkbox" data-c="zipo" data-k="' + k + '"' + (o[k] ? ' checked' : '') + '> ' + t + '</label>';
  return '<div class="card"><h2>Tải hàng loạt (file ZIP)</h2><p class="muted small" style="margin:2px 0 8px">Mỗi kỳ một thư mục, trong đó chia theo loại: sổ kế toán, báo cáo tài chính, tờ khai thuế, lao động – bảo hiểm, chứng từ, sổ PS. Kỳ không có phát sinh thì bỏ qua. Tạo ngay trên máy, không gửi dữ liệu đi đâu.</p>' +
    '<div class="row" style="gap:6px;align-items:center;flex-wrap:wrap"><label class="f">Năm<select data-c="zipo" data-k="y">' + years().map(y => '<option' + (+o.y === y ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label><span><b class="small">Theo kỳ:</b> ' + ck('thang', 'Từng tháng') + ck('quy', 'Từng quý') + ck('nam', 'Cả năm') + ck('ky', 'Kỳ đang chọn ở thanh trên') + '</span></div>' +
    '<div style="margin-top:6px"><b class="small">Loại:</b> ' + ck('so', 'Sổ kế toán') + ck('bc', 'Báo cáo tài chính (quý, năm)') + ck('th', 'Tờ khai thuế') + ck('ld', 'Lao động – bảo hiểm (tháng có lương)') + ck('ct', 'Chứng từ') + ck('dm', 'Danh mục, công nợ (theo năm)') + ck('ps', 'Sổ PS (Excel)') + '</div>' +
    '<div style="margin-top:6px">' + ck('tach', 'Tách mỗi chứng từ một file') + ck('auto', 'Sổ PS gồm cả bút toán tự động') + '</div>' +
    '<div class="row" style="margin-top:8px;align-items:center"><button class="btn pri" data-a="zipgo">Tải file ZIP</button><span class="muted small" id="zipst"></span></div></div>'; };

/* ---- tải riêng sổ PS ---- */
UI.act.psdl = () => { const p = UI.P(), ys = years();
  UI.modal('Tải sổ PS', '<div class="form"><label class="f"><span>Phạm vi</span><select id="psdr"><option value="all">Toàn bộ sổ PS</option><option value="per">Kỳ đang chọn: ' + E(p.label) + '</option>' + ys.map(y => '<option value="y' + y + '">Năm ' + y + '</option>').join('') + '<option value="view">Đúng các dòng đang lọc trên màn hình</option></select></label>' +
    '<label class="f"><span>Định dạng</span><select id="psdf"><option value="xls">Excel (.xls)</option><option value="csv">CSV (.csv, mở được bằng Excel, Google Sheets)</option><option value="zipm">ZIP: mỗi tháng một file Excel</option><option value="zipq">ZIP: mỗi quý một file Excel</option></select></label>' +
    '<label class="f"><span>Dòng</span><select id="psda"><option value="1">Gồm cả bút toán tự động</option><option value="0">Chỉ dòng nhập tay</option></select></label></div><p class="muted small">Cột giống khi dán vào sổ PS, nên có thể dán ngược lại (khôi phục, chuyển sang máy khác) hoặc gửi cho kiểm toán, cơ quan thuế.</p>',
    '<button class="btn" data-a="close">Hủy</button><button class="btn pri" data-a="psdlok">Tải</button>'); };
UI.act.psdlok = () => { const r = document.getElementById('psdr').value, fm = document.getElementById('psdf').value, au = document.getElementById('psda').value === '1', p = UI.P(); UI.closeModal();
  let from = '', to = '', lab = 'toan-bo', rows;
  if (r === 'per') { from = p.from; to = p.to; lab = p.label; } else if (r[0] === 'y') { from = r.slice(1) + '-01-01'; to = r.slice(1) + '-12-31'; lab = 'Nam ' + r.slice(1); }
  if (r === 'view' && UI.psFiltered) { const J = S().journal; rows = UI.psFiltered().map(i => J[i]).filter(j => au || !j.tag); lab = 'dang-loc'; } else rows = psRows(from, to, au);
  if (!rows.length) { UI.toast('Không có dòng nào trong phạm vi đã chọn'); return; }
  const base = 'So-PS ' + safe(lab);
  if (fm === 'xls') UI.downloadBlob(base + '.xls', new Blob([KT.psXls(rows, 'SỔ PS – ' + lab)], { type: 'application/vnd.ms-excel;charset=utf-8' }));
  else if (fm === 'csv') UI.downloadBlob(base + '.csv', new Blob([KT.psCsv(rows)], { type: 'text/csv;charset=utf-8' }));
  else { const g = new Map(); rows.forEach(j => { const d = D.parse(j.ng) || ''; const k = !d ? 'Khong-ngay' : fm === 'zipm' ? d.slice(0, 7) : d.slice(0, 4) + '-Q' + Math.ceil(+d.slice(5, 7) / 3); if (!g.has(k)) g.set(k, []); g.get(k).push(j); });
    UI.downloadBlob(base + '.zip', KT.zip([...g.entries()].map(([k, ls]) => ({ name: 'So PS ' + k + '.xls', data: KT.psXls(ls, 'SỔ PS ' + k) })))); }
  UI.closeModal(); };
})(window);

/* ===== KHỞI ĐỘNG ===== */
(function (G) {
'use strict';
const KT = G.KT, UI = KT.ui;
KT.on(() => UI.render());
G.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && UI.routes[id] && id !== UI.at) UI.go(id); });
G.addEventListener('beforeunload', () => { try { KT.saveNow(); } catch (e) { } });
G.addEventListener('error', e => { console.error(e.error || e.message); });
(async function () {
  let had = false; try { had = await KT.initStore(); } catch (e) { console.error(e); }
  UI.initPer(); const id = location.hash.slice(1); UI.at = UI.routes[id] ? id : 'dash'; KT.onSaved = () => { };
  UI.render();
  if (KT.dbMode && KT.sync && KT.sync.empty) UI.welcome();
})();
})(window);

</script>
